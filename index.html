<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitTree</title>
    <script>
      // 在页面渲染前设置主题和底色，避免启动时白屏。默认深色（和 GitKraken 一样）
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("gittree.theme") || "dark";
        } catch (e) {}
        var root = document.documentElement;
        // 自定义和内置的其他主题：themes.svelte.ts 缓存了算好的配色
        var boot = null;
        try {
          boot = JSON.parse(localStorage.getItem("gittree.themeVars") || "null");
        } catch (e) {}
        if (boot && boot.vars) {
          root.dataset.theme = boot.base;
          for (var k in boot.vars) root.style.setProperty(k, boot.vars[k]);
          root.style.background = boot.vars["--bg-graph"];
          root.style.colorScheme = boot.base;
          return;
        }
        root.dataset.theme = theme;
        var light = theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        root.style.background = light ? "#f8f9fb" : "#1c1e23";
        root.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
    <style>
      /* 脚本加载完之前显示的启动画面，界面挂载后移除 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #8b93a1;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #boot .spin {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(139, 147, 161, 0.25);
        border-top-color: #4d8ef7;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="spin"></div>GitTree</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
